name: Maker Comms
description: Maker Communications was an early networking-silicon company that designed high-performance
  programmable communications processors and related software for ATM and Internet Protocol data, voice,
  and video networks. Founded in 1994 and backed by Lightspeed Venture Partners (early investment in 1997,
  Barry Eggers), the company went public in 1999 on NASDAQ under the ticker MAKR and was acquired by Conexant
  Systems (NASDAQ CNXT) in 2000. It exists in the API Evangelist network as a portfolio-lead stub; it is a
  defunct, fully-exited hardware/semiconductor company with no surviving public developer program, API, or
  documentation surface to enrich.
